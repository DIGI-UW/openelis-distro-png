# OpenELIS Global: Papua New Guinea distribution, core services.
#
# Layout (mirrors OpenELIS-Global-2 `develop`):
#   docker-compose.yml            core: database, webapp, FHIR, front end, proxy
#   docker-compose.analyzers.yml  Analyzer Bridge (pairs with OpenELIS by code)
#   compose.letsencrypt.yaml      optional: Let's Encrypt certificate for the proxy
#   compose.ha.yaml               optional: streaming-replication failover
#   docker-compose.site.yml       optional, gitignored: this server's own overrides
# COMPOSE_FILE in .env selects the set, so plain `docker compose ...` works.
#
# Persistence: everything a site must keep lives on the host under DATA_ROOT
# (default ./data, gitignored). No named volumes: losing Docker's volume store
# loses nothing. Tracked configuration under ./configs is the PNG baseline.

x-logging:
  &local-logging
  driver: "local"
  options:
    max-size: "20m"
    max-file: "50"

services:
    # Runs as root once per `up`, before anything else: creates the DATA_ROOT
    # tree with the owners each service runs as, and makes this site's own
    # internal TLS material (keystore, truststore, proxy fallback
    # certificate) the first time. See scripts/init-data.sh.
    init:
        container_name: oe-init
        # Only for its JDK keytool and openssl; the stores it ships are not used.
        image: itechuw/certgen:main@sha256:b769aba3465e921239e8cb732e47406e38a5ee2ef40853e34f794433d96bf5fe
        platform: linux/amd64
        restart: "no"
        user: "0:0"
        entrypoint: ["bash", "/opt/openelis/init-data.sh"]
        environment:
            - OE_ADMIN_PASSWORD=${OE_ADMIN_PASSWORD:?Set a unique administrator password}
            - OE_DB_PASSWORD=${OE_DB_PASSWORD:?Set a unique database password}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a unique database superuser password}
            - KEYSTORE_PW=${SSL_KEYSTORE_PASSWORD:-kspass}
            - TRUSTSTORE_PW=${SSL_TRUSTSTORE_PASSWORD:-tspass}
            - OE_CONFIGURATION_AUTOCREATE=${OE_CONFIGURATION_AUTOCREATE:-true}
            - CONFIGURATION_REGISTRY_USERNAME=${CONFIGURATION_REGISTRY_USERNAME:-}
            - CONFIGURATION_REGISTRY_TOKEN=${CONFIGURATION_REGISTRY_TOKEN:-}
            - WEBAPP_UID=8443
            - BRIDGE_UID=${BRIDGE_UID:-9257}
        volumes:
            - ./scripts/init-data.sh:/opt/openelis/init-data.sh:ro
            - ./scripts:/scripts:ro
            - ./scripts/prepare-configuration-packages.py:/opt/openelis/prepare-configuration-packages.py:ro
            - ./configs/configuration-packages:/opt/openelis/configuration-packages:ro
            - ./configs/configuration:/opt/openelis/configuration
            - ${DATA_ROOT:-./data}:/data
        networks:
            - openelis-network

    db.openelis.org:
        container_name: openelisglobal-database
        image: itechuw/openelis-global-2-database:develop@sha256:0e989fb19f3e8c68cec00c1ec24593ec454c97f6fef643b82986e93f1da2509a
        platform: linux/amd64
        restart: always
        depends_on:
            init:
                condition: service_completed_successfully
        env_file:
            - ./configs/database/database.env
        environment:
            - DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
            - DB_SUPERUSER_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
            - POSTGRES_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
            - TZ=${TZ:-Pacific/Port_Moresby}
        volumes:
            # DB_VOLUME_MOUNT stays as an override for scripts/ha.
            - ${DB_VOLUME_MOUNT:-${DATA_ROOT:-./data}/db}:/var/lib/postgresql/data
        logging: *local-logging
        networks:
            - openelis-network
        healthcheck:
            test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
            timeout: 45s
            interval: 10s
            retries: 10

    oe.openelis.org:
        container_name: openelisglobal-webapp
        image: ghcr.io/digi-uw/openelis-global-2:png-amr-908d3ce335@sha256:68a690ee056da168cd84780c86abe38a293aaa1ab513f43bbf30a9416522fdf7
        platform: linux/amd64
        depends_on:
            init:
                condition: service_completed_successfully
            db.openelis.org:
                condition: service_healthy
        ports:
            # Behind the proxy; reachable from this host only.
            - "${LOCAL_BIND:-127.0.0.1}:8080:8080"
            - "${LOCAL_BIND:-127.0.0.1}:8443:8443"
        restart: always
        healthcheck:
            # Must assert HTTP 200 *and* {"status":"UP"} in the body: when the
            # Spring context fails to start (for example a wrong
            # OE_DB_PASSWORD), Tomcat still answers /health with a 302, and
            # `curl -f` alone would report the stack healthy.
            test: ["CMD-SHELL", "curl -k -s -o /tmp/oe-health -w '%{http_code}' https://localhost:8443/api/OpenELIS-Global/health | grep -qx 200 && grep -q '\"UP\"' /tmp/oe-health"]
            interval: 15s
            timeout: 10s
            retries: 8
            # The full AMR standards import can exceed 30 minutes under amd64
            # emulation. Preserve its one-hour startup grace in the combined
            # target; the first passing check ends this grace immediately.
            start_period: 3600s
        labels:
            # Restarted by the autoheal service when unhealthy.
            - png-autoheal=true
            - autoheal.stop.timeout=60
        networks:
          openelis-network:
              ipv4_address: 172.20.1.121
        logging: *local-logging
        environment:
            # NOTE: no DEFAULT_PW here. Upstream reads it only at image BUILD
            # time. init-admin sets the site password and verify-admin checks
            # it before Compose starts the proxy.
            - TZ=${TZ:-Pacific/Port_Moresby}
            # Tomcat server.xml settings. configuration.autocreate is passed as
            # a system property so a site can switch catalog loading off from
            # .env (OE_CONFIGURATION_AUTOCREATE=false) without editing the
            # tracked common.properties: system properties win over it.
            # ExitOnOutOfMemoryError: a JVM out of memory stays up but stops
            # working; exiting lets `restart: always` bring it back.
            - CATALINA_OPTS= -XX:+ExitOnOutOfMemoryError -Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OE_DB_PASSWORD:-clinlims} -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD:-tspass} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore} -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD:-kspass} -Dorg.openelisglobal.configuration.autocreate=${OE_CONFIGURATION_AUTOCREATE:-true}
            # Read by common.properties placeholders.
            - SSL_KEYSTORE_PATH=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
            - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-kspass}
            - SSL_TRUSTSTORE_PATH=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
            - SSL_TRUSTSTORE_PASSWORD=${SSL_TRUSTSTORE_PASSWORD:-tspass}
        volumes:
            - ${DATA_ROOT:-./data}/tls/stores:/etc/openelis-global
            - ${DATA_ROOT:-./data}/webapp/lucene:/var/lib/lucene_index
            # OpenELIS writes TotalSystemConfiguration.properties and
            # ChangedSystemConfiguration.properties here; the tracked baseline
            # SystemConfiguration.properties is mounted read-only inside it.
            - ${DATA_ROOT:-./data}/webapp/properties:/var/lib/openelis-global/properties
            - ./configs/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties:ro
            - ${DATA_ROOT:-./data}/webapp/branding:/var/lib/openelis-global/branding
            - ${DATA_ROOT:-./data}/webapp/nce-attachments:/var/lib/openelis-global/nce-attachments
            - ${DATA_ROOT:-./data}/webapp/reporting:/var/lib/openelis-global/reporting
            - ${DATA_ROOT:-./data}/logs/oe:/var/lib/openelis-global/logs
            - ${DATA_ROOT:-./data}/logs/tomcat:/usr/local/tomcat/logs
            # Sourced by catalina.sh before the JVM starts: stops Tomcat
            # printing every -D flag, including -Ddatasource.password, at boot.
            - ./configs/tomcat/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
            - ./configs/tomcat/quiet-startup.sh:/usr/local/tomcat/bin/png-quiet-startup.sh:ro
            - ./configs/plugins/:/var/lib/openelis-global/plugins
            - ./configs/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
            - ./configs/programs/:/var/lib/openelis-global/programs
            # Catalog CSVs (baseline) plus the checksums OpenELIS writes back.
            - ./configs/configuration:/var/lib/openelis-global/configuration
            - ./configs/menu/menu_config.json:/var/lib/openelis-global/menu/menu_config.json:ro
            # Translation overrides; the printed patient report reads them here.
            - ./configs/translation:/var/lib/openelis-global/translation:ro
        secrets:
            - source: common.properties

    fhir.openelis.org:
        group_add: ["8443"]
        container_name: external-fhir-api
        platform: linux/amd64
        image: itechuw/openelis-global-2-fhir:develop@sha256:3f063dc5512a15e4c07902068db9e84ed8a73f8967987805e8d47e384fceb044
        ports:
            - "${LOCAL_BIND:-127.0.0.1}:8081:8080"
            - "${LOCAL_BIND:-127.0.0.1}:8444:8443"
        depends_on:
            init:
                condition: service_completed_successfully
            db.openelis.org:
                condition: service_healthy
        networks:
            - openelis-network
        restart: always
        healthcheck:
            # HAPI on 8443 requires client-certificate TLS; a TCP probe is
            # enough to show it is listening.
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8443'"]
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 60s
        labels:
            - png-autoheal=true
            - autoheal.stop.timeout=30
        environment:
          TZ: ${TZ:-Pacific/Port_Moresby}
          JAVA_OPTS: "-XX:+ExitOnOutOfMemoryError
                      -Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
                      -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD:-tspass}
                      -Djavax.net.ssl.trustStoreType=pkcs12
                      -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
                      -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD:-kspass}
                      -Djavax.net.ssl.keyStoreType=pkcs12"
          CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD:-tspass} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore} -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD:-kspass}"
          FHIR_DATASOURCE_URL : "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
          FHIR_DATASOURCE_USERNAME: "clinlims"
          FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
          FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
        logging: *local-logging
        volumes:
            - ${DATA_ROOT:-./data}/tls/stores:/etc/openelis-global:ro
            - ./configs/tomcat/quiet-startup.sh:/usr/local/tomcat/bin/setenv.sh:ro

    frontend.openelis.org:
        image: ghcr.io/digi-uw/openelis-global-2-frontend:png-amr-908d3ce335@sha256:c5a0e1627aa64d22ffea2a23f9dea21a1cf8340682ee6de55186cd793fdef843
        container_name: openelisglobal-front-end
        platform: linux/amd64
        # Without a restart policy the front end stays down after a reboot and
        # the proxy has no upstream.
        restart: always
        networks:
            - openelis-network
        environment:
            - CHOKIDAR_USEPOLLING=true
            - TZ=${TZ:-Pacific/Port_Moresby}
        volumes:
            # Translation overrides, served at /translation/<locale>.json. See
            # configs/translation/README.md.
            - ./configs/translation:/usr/share/nginx/html/translation:ro
        logging: *local-logging
        tty: true
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null 2>&1 || curl -sf http://localhost:80/ > /dev/null"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    proxy:
        image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
        container_name: openelisglobal-proxy
        platform: linux/amd64
        ports:
            - 80:80
            - 443:443
        volumes:
            # This site's own self-signed certificate (made by init); replaced
            # by a Let's Encrypt one with compose.letsencrypt.yaml.
            - ${DATA_ROOT:-./data}/tls/certs:/etc/nginx/certs/
            - ${DATA_ROOT:-./data}/tls/keys:/etc/nginx/keys/
            - ${DATA_ROOT:-./data}/tls/stores/internal.crt:/etc/nginx/png-internal.crt:ro
            - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            # ACME HTTP-01 webroot (scripts/generate-letsencrypt-certs.sh, or
            # the host's certbot when CERTBOT_WEBROOT points at its webroot).
            - ${CERTBOT_WEBROOT:-./configs/nginx/certbot}:/var/www/certbot
        restart: unless-stopped
        networks:
            - openelis-network
        logging: *local-logging
        depends_on:
            verify-admin:
                condition: service_completed_successfully
            init:
                condition: service_completed_successfully
            oe.openelis.org:
                condition: service_healthy
            frontend.openelis.org:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null 2>&1 || curl -sf http://localhost:80/ > /dev/null"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s

    # Docker restarts a container that exits, never one that is running but
    # unhealthy. This restarts containers labelled png-autoheal=true (the webapp
    # and FHIR) once their healthcheck reports unhealthy. The database is left
    # out on purpose: a failing pg_isready usually means recovery or load, which
    # a restart makes worse, and a crashed Postgres exits and is restarted anyway.
    autoheal:
        container_name: autoheal-oe
        image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
        restart: always
        environment:
            - AUTOHEAL_CONTAINER_LABEL=png-autoheal
            - TZ=${TZ:-Pacific/Port_Moresby}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        # The image's own healthcheck can sit at "starting" and stall
        # `docker compose down`; nothing depends on it.
        healthcheck:
            disable: true
        network_mode: none
        logging: *local-logging

    init-admin:
        image: itechuw/openelis-global-2-database:develop@sha256:0e989fb19f3e8c68cec00c1ec24593ec454c97f6fef643b82986e93f1da2509a
        platform: linux/amd64
        restart: "no"
        entrypoint: ["sh", "/scripts/init-admin-password.sh"]
        depends_on:
            oe.openelis.org:
                condition: service_healthy
        environment:
            PGHOST: db.openelis.org
            PGUSER: postgres
            PGDATABASE: clinlims
            PGPASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
            OE_ADMIN_PASSWORD: ${OE_ADMIN_PASSWORD:?Set OE_ADMIN_PASSWORD}
        volumes:
            - ./scripts:/scripts:ro
            - ${DATA_ROOT:-./data}/installation:/installation-state
        networks: [openelis-network]

    verify-admin:
        image: itechuw/certgen:main@sha256:b769aba3465e921239e8cb732e47406e38a5ee2ef40853e34f794433d96bf5fe
        platform: linux/amd64
        restart: "no"
        entrypoint: ["sh", "/scripts/verify-admin-password.sh"]
        depends_on:
            init-admin:
                condition: service_completed_successfully
        environment:
            OE_ADMIN_PASSWORD: ${OE_ADMIN_PASSWORD:?Set OE_ADMIN_PASSWORD}
        volumes:
            - ./scripts:/scripts:ro
            - ${DATA_ROOT:-./data}/installation:/installation-state
            - ${DATA_ROOT:-./data}/tls/stores/internal.crt:/etc/openelis-global/internal.crt:ro
        networks: [openelis-network]

secrets:
  common.properties:
    file:  ./configs/properties/common.properties

networks:
  openelis-network:
    name: openelis-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
