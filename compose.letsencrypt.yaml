# Let's Encrypt overlay for the reverse proxy.
# Usage:
#   docker compose -f docker-compose.yml -f compose.letsencrypt.yaml up -d
#   # (add other overlays as needed, e.g. -f compose.validate.yaml)
#
# Certificates: run ./scripts/generate-letsencrypt-certs.sh from repo root after proxy is up.
# Env: LETSENCRYPT_EMAIL (required), LETSENCRYPT_DOMAINS / LETSENCRYPT_PRIMARY_DOMAIN / LETSENCRYPT_CERT_NAME
# Set them in .env (see the LETSENCRYPT_* block in .env.example); both this
# overlay and the script read them from there.
#
# Compose replaces service volumes on override; this file lists the full proxy volume set.

services:
    proxy:
        volumes:
            - certs-vol:/etc/nginx/certs/
            - keys-vol:/etc/nginx/keys/
            - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./configs/nginx/certbot:/var/www/certbot
            - ./configs/letsencrypt:/etc/letsencrypt:ro
            - ./configs/nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
        environment:
            # Neutral placeholders only. These used to default to
            # a test host from another project, so an
            # unconfigured PNG deployment looked for a certificate lineage
            # belonging to a different site. Override every one of
            # them in .env before using this overlay.
            - LETSENCRYPT_DOMAINS=${LETSENCRYPT_DOMAINS:-example.com}
            - LETSENCRYPT_PRIMARY_DOMAIN=${LETSENCRYPT_PRIMARY_DOMAIN:-example.com}
            - LETSENCRYPT_CERT_NAME=${LETSENCRYPT_CERT_NAME:-example.com}
        entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
