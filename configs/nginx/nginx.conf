worker_processes 1;

events { worker_connections 1024; }
http {
    # Docker's embedded DNS, re-read every 10 s. Upstreams below are variables,
    # so nginx resolves them per request: recreating a container (for example
    # on an update) needs no proxy restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Catch-all HTTP-01 challenge server so hostname additions stay compose-driven.
    server {
        listen [::]:80;
        listen 80;
        server_name _;

        # ^~ ensures this wins over location / (nginx 1.15 prefix matching)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default_server;
        # Host routing is generic here; certificate SANs are driven by compose env vars.
        server_name _ localhost;

        # This site's own self-signed certificate, or the Let's Encrypt one
        # linked in its place by compose.letsencrypt.yaml.
        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        absolute_redirect off;
        client_max_body_size 50m;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            set $frontend_upstream http://frontend.openelis.org;
            proxy_pass $frontend_upstream;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Passed through with the full original URI (/api/...).
        location /api/ {
            set $oe_upstream https://oe.openelis.org:8443;
            proxy_pass $oe_upstream;
            proxy_redirect off;
            proxy_ssl_verify off;
            proxy_read_timeout 300s;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
