name: Release

# Release a committed candidate without resolving mutable image tags again.
# Update pins, test them and commit before selecting base_ref. Pushes to main
# produce an inspection artifact but never publish a release.

on:
  workflow_dispatch:
    inputs:
      distro_version:
        description: "Distro release version (e.g. 3.2.2.0). Must not collide with an existing tag."
        required: true
        type: string
      oe_version:
        description: "OpenELIS Global tag already pinned in the tested base_ref."
        required: true
        type: string
      bridge_version:
        description: "Analyzer Bridge tag already pinned in the tested base_ref."
        required: true
        type: string
      base_ref:
        description: "Branch or commit SHA to release from."
        required: false
        default: "main"
        type: string
      allow_develop_pins:
        description: "Allow development image labels for a prerelease candidate. Digests are always required."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub Release as a draft for review before publishing."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

jobs:
  artifact:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Build tarball
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/build-tarball.sh
          echo "TARBALL=openelis-png-distro-${REF_NAME//\//-}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          retention-days: 90

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Surface workflow_dispatch inputs as env vars so run: blocks reference
      # them via $VAR (bash) rather than ${{ … }} template interpolation —
      # avoids shell-injection risk surfaced by the GHA workflow security guide.
      DISTRO_VERSION: ${{ inputs.distro_version }}
      OE_VERSION_INPUT: ${{ inputs.oe_version }}
      BRIDGE_VERSION_INPUT: ${{ inputs.bridge_version }}
      BASE_REF: ${{ inputs.base_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs and capture previous tag
        id: prev_tag
        run: |
          if ! [[ "$DISTRO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "ERROR: distro_version '$DISTRO_VERSION' does not match expected semver shape." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${DISTRO_VERSION}" > /dev/null 2>&1; then
            echo "ERROR: tag '${DISTRO_VERSION}' already exists on origin." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${DISTRO_VERSION}" > /dev/null; then
            echo "ERROR: tag '${DISTRO_VERSION}' already exists locally." >&2
            exit 1
          fi
          # Highest-versioned existing tag is treated as "previous" for diff purposes.
          PREV_TAG="$(git tag --list --sort=-v:refname | head -n 1 || true)"
          echo "value=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous distro tag: ${PREV_TAG:-<none>}"

      - name: Verify requested versions match the committed candidate
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          refs = re.findall(r'^\s+image:\s+(\S+)', Path('docker-compose.yml').read_text(), re.M)
          for ref in refs:
              repo, tag = ref.split('@')[0].rsplit(':', 1)
              expected = (os.environ['BRIDGE_VERSION_INPUT'] if repo == 'itechuw/openelis-analyzer-bridge'
                          else os.environ['OE_VERSION_INPUT'] if repo.startswith('itechuw/openelis-global-2') else tag)
              if tag != expected:
                  raise SystemExit('Requested tags differ from base_ref. Pin, test and commit the candidate before releasing.')
          PYTHON

      - name: Validate immutable image pins
        run: ./scripts/check-release-pins.sh

      - name: Require release image labels unless explicitly allowed
        if: ${{ inputs.allow_develop_pins != true }}
        run: |
          for tag in "$OE_VERSION_INPUT" "$BRIDGE_VERSION_INPUT"; do
            case "$tag" in develop|latest|main|master|nightly)
              echo "Development image label requires allow_develop_pins=true." >&2
              exit 1 ;;
            esac
          done

      - name: Tag the selected candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${DISTRO_VERSION}" -m "Release ${DISTRO_VERSION}"
          git push origin "refs/tags/${DISTRO_VERSION}"

      - name: Build tarball from release tag
        env:
          REF_NAME: ${{ env.DISTRO_VERSION }}
        run: |
          ./scripts/build-tarball.sh "${DISTRO_VERSION}"
          echo "TARBALL=openelis-png-distro-${DISTRO_VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        # Uploaded before Release publication so the tarball is still
        # retrievable from the run if a later step (notes, publish) fails.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          retention-days: 90

      - name: Build release notes
        env:
          DISTRO_VERSION: ${{ env.DISTRO_VERSION }}
          OE_VERSION: ${{ env.OE_VERSION_INPUT }}
          BRIDGE_VERSION: ${{ env.BRIDGE_VERSION_INPUT }}
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-release-notes.sh > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.DISTRO_VERSION }}
          name: "OpenELIS Papua New Guinea Distro ${{ env.DISTRO_VERSION }}"
          body_path: release-notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ env.TARBALL }}
