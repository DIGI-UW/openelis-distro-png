name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate disposable validation credentials
        run: |
          for name in OE_ADMIN_PASSWORD OE_DB_PASSWORD ADMIN_PASSWORD; do
            printf '%s=Png9!%s\n' "$name" "$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          done

      - name: Validate immutable image pins
        run: ./scripts/check-release-pins.sh

      - name: Test distro configuration and metadata
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test fresh private identity and retained keys
        run: PNG_TEST_SECURITY=1 python3 -m unittest discover -s tests -p test_install_security.py -v

      - name: Validate PNG profiles using the released Bridge
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./scripts/check-analyzer-profiles.sh

      - name: Verify pinned metadata downloads anonymously from an empty cache
        run: |
          proof=$(mktemp -d)
          trap 'rm -rf "$proof"' EXIT
          env -i PATH="$PATH" HOME="$proof/home" DOCKER_CONFIG="$proof/docker" \
            python3 scripts/prepare-configuration-packages.py \
              --pins configs/configuration-packages \
              --cache "$proof/cache" --configuration "$proof/configuration"

      - name: Validate compose syntax + path resolution
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f compose.letsencrypt.yaml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.analyzers.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.analyzers.yml -f compose.letsencrypt.yaml config > /dev/null
